<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fake News Detection</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }
        .container {
            max-width: 760px;
            margin: 60px auto;
            padding: 24px;
        }
        .card {
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 28px;
        }
        h1 {
            margin-top: 0;
            text-align: center;
            color: #0f172a;
        }
        p {
            line-height: 1.6;
        }
        textarea {
            width: 100%;
            min-height: 220px;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 16px;
            resize: vertical;
            box-sizing: border-box;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            margin-top: 16px;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #1d4ed8;
        }
        .result {
            margin-top: 20px;
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            text-align: center;
        }
        .real {
            background: #dcfce7;
            color: #166534;
        }
        .fake {
            background: #fee2e2;
            color: #991b1b;
        }
        .notice {
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 10px;
            background: #fff7ed;
            color: #9a3412;
        }
        .footer {
            margin-top: 14px;
            font-size: 13px;
            color: #64748b;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Fake News Detection</h1>
               {% if notice %}
            <div class="notice">{{ notice }}</div>
            {% endif %}

            <form method="POST">
                <textarea name="news_text" placeholder="Enter news content here...">{{ news_text }}</textarea>
                <button type="submit">Predict</button>
            </form>

            {% if prediction %}
            <div class="result {{ prediction_class }}">Prediction: {{ prediction }}</div>
            <div class="footer">Confidence: {{ confidence }}%</div>
            {% endif %}
        </div>
        <div class="footer">Simple Flask + NLP project using TF-IDF and Logistic Regression</div>
    </div>
</body>
</html>
